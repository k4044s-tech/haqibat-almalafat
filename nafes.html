<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>راصد نافس — نَسَق</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 96%22%3E%3Crect x=%2230%22 y=%2210%22 width=%2246%22 height=%2260%22 rx=%227%22 fill=%22%23c1b489%22/%3E%3Crect x=%2224%22 y=%2219%22 width=%2246%22 height=%2260%22 rx=%227%22 fill=%22%230da9a6%22/%3E%3Crect x=%2218%22 y=%2228%22 width=%2246%22 height=%2260%22 rx=%227%22 fill=%22%2315445a%22/%3E%3Crect x=%2227%22 y=%2243%22 width=%2228%22 height=%224.5%22 rx=%222.25%22 fill=%22%23fff%22/%3E%3Crect x=%2227%22 y=%2254%22 width=%2228%22 height=%224.5%22 rx=%222.25%22 fill=%22%23fff%22 opacity=%22.7%22/%3E%3Crect x=%2227%22 y=%2265%22 width=%2217%22 height=%224.5%22 rx=%222.25%22 fill=%22%23fff%22 opacity=%22.7%22/%3E%3Ccircle cx=%2254%22 cy=%2277%22 r=%224.5%22 fill=%22%23c1b489%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#15445a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@600;700&display=swap">
<style>
/* Layout: Shadcn Admin shell — sidebar on the inline-start (right in RTL), sticky top bar with search + theme, cards on a white canvas */
:root{
  --background:#ffffff; --foreground:#020618; --card:#ffffff; --primary:#0f172b; --primary-fg:#f8fafc;
  --muted-bg:#f1f5f9; --muted-fg:#62748e; --border:#e2e8f0; --input:#e2e8f0; --ring:#90a1b9; --destructive:#e7000b;
  --chart:#0f172b;
  /* legacy aliases used by the views */
  --paper:var(--background); --surface:var(--card); --ink:var(--foreground); --muted:var(--muted-fg);
  --line:var(--border); --line-2:#cad5e2; --accent:var(--primary); --accent-ink:var(--primary-fg);
  --leaf:var(--muted-bg); --leaf-2:#e2e8f0; --focus:var(--ring);
  --adv:#008236; --prof:#155dfc; --basic:#bb4d00; --beg:#c10007; --abs:#62748e;
  --adv-bg:#dcfce7; --prof-bg:#dbeafe; --basic-bg:#fef3c6; --beg-bg:#ffe2e2;
  --font-display:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  --radius:10px; --sbw:16rem; --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:#020618; --foreground:#f8fafc; --card:#0b1120; --primary:#e2e8f0; --primary-fg:#0f172b;
  --muted-bg:#1d293d; --muted-fg:#90a1b9; --border:rgba(255,255,255,.1); --input:rgba(255,255,255,.15); --ring:#62748e; --destructive:#ff6467;
  --chart:#e2e8f0; --line-2:rgba(255,255,255,.18); --leaf-2:#314158;
  --adv:#05df72; --prof:#51a2ff; --basic:#ffb900; --beg:#ff6467; --abs:#90a1b9;
  --adv-bg:rgba(5,223,114,.13); --prof-bg:rgba(81,162,255,.15); --basic-bg:rgba(255,185,0,.14); --beg-bg:rgba(255,100,103,.15); color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#020618; --foreground:#f8fafc; --card:#0b1120; --primary:#e2e8f0; --primary-fg:#0f172b;
  --muted-bg:#1d293d; --muted-fg:#90a1b9; --border:rgba(255,255,255,.1); --input:rgba(255,255,255,.15); --ring:#62748e; --destructive:#ff6467;
  --chart:#e2e8f0; --line-2:rgba(255,255,255,.18); --leaf-2:#314158;
  --adv:#05df72; --prof:#51a2ff; --basic:#ffb900; --beg:#ff6467; --abs:#90a1b9;
  --adv-bg:rgba(5,223,114,.13); --prof-bg:rgba(81,162,255,.15); --basic-bg:rgba(255,185,0,.14); --beg-bg:rgba(255,100,103,.15); color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:14px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:not(:disabled){cursor:pointer}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.06rem;font-weight:600}h3{font-size:.95rem;font-weight:600}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:flex;min-height:100vh;overflow-x:clip}
.sb{width:var(--sbw);flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--background);border-inline-end:1px solid var(--border);padding:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-right:max(8px,env(safe-area-inset-right,0px));transition:margin .2s ease;z-index:30}
.shell.collapsed .sb{margin-inline-start:calc(-1 * var(--sbw))}
.sb-head{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
.sb-head .logo{width:36px;height:36px;border-radius:8px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;flex:none}
.sb-head .logo img{width:32px}
.sb-title{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.sb-title b{font-size:.92rem;font-weight:600}
.sb-title small{font-size:.75rem;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:4px 0}
.sb-group{padding:8px 0 4px}
.sb-label{font-size:.72rem;font-weight:500;color:var(--muted-fg);padding:0 10px;height:28px;display:flex;align-items:center}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:.88rem;color:var(--foreground);text-align:start}
.sb-item:hover{background:var(--muted-bg)}
.sb-item[aria-current="page"]{background:var(--muted-bg);font-weight:600}
.sb-item .cnt{margin-inline-start:auto;font-size:.72rem;background:var(--primary);color:var(--primary-fg);border-radius:6px;padding:0 6px;font-weight:600;font-variant-numeric:tabular-nums}
.sb-foot{border-top:1px solid var(--border);padding-top:8px}
.user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;border:0;background:none;width:100%;text-align:start}
.user:hover{background:var(--muted-bg)}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--muted-bg);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.user div{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.user b{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user small{font-size:.74rem;color:var(--muted-fg)}
.scrim{display:none}
.inset{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--background) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.topbar .sep{width:1px;height:24px;background:var(--border)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--input);background:var(--background);border-radius:8px;box-shadow:var(--shadow-xs);color:var(--foreground)}
.icon-btn:hover{background:var(--muted-bg)}
.search{display:flex;align-items:center;gap:8px;height:36px;width:min(100%,280px);border:1px solid var(--input);border-radius:8px;background:var(--muted-bg);color:var(--muted-fg);padding:0 10px;font-size:.85rem;text-align:start}
.search span{flex:1}
.search kbd{font-family:inherit;font-size:.7rem;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 5px;direction:ltr}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
main{padding-block:8px 64px;display:flex;flex-direction:column;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1320px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:4px}
.page-head h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--muted-fg)}

/* building blocks (shadcn card / button / input / table / badge) */
.sheet{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;min-width:0;box-shadow:var(--shadow-xs)}
.sheet>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.muted{color:var(--muted-fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;font-weight:500;color:var(--foreground)}
input[type=text],input[type=number],input[type=date],select,textarea{background:transparent;border:1px solid var(--input);border-radius:8px;padding:0 10px;height:36px;min-width:0;box-shadow:var(--shadow-xs)}
select{padding-inline-end:28px}
select option{background:var(--card);color:var(--foreground)}
textarea{min-height:150px;height:auto;padding:8px 10px;resize:vertical;line-height:1.8}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 45%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border:1px solid var(--input);background:var(--background);border-radius:8px;padding:0 14px;font-weight:500;font-size:.875rem;white-space:nowrap;box-shadow:var(--shadow-xs);transition:background .15s}
.btn:hover{background:var(--muted-bg)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{background:color-mix(in srgb,var(--primary) 90%,transparent)}
.btn.sm{height:32px;padding:0 11px;font-size:.82rem}
.btn.warn{color:var(--destructive)}
.btn.warn.armed{background:var(--destructive);color:#fff;border-color:var(--destructive)}
.btn:focus-visible,.sb-item:focus-visible,.icon-btn:focus-visible,.search:focus-visible,.user:focus-visible,.c:focus-visible,.kb:focus-visible,.chip:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 55%,transparent)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:500}
.kpi .kh svg{color:var(--muted-fg)}
.kpi b{display:block;font:700 1.55rem/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted-fg)}
.kpi>span:first-child{font-weight:500;color:var(--foreground);font-size:.85rem}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:28px;text-align:center;color:var(--muted-fg)}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.875rem}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:start;vertical-align:middle}
table.t th{font-size:.82rem;color:var(--muted-fg);font-weight:500;height:40px;background:transparent}
table.t tbody tr:hover{background:color-mix(in srgb,var(--muted-bg) 55%,transparent)}
table.t tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:.75rem;font-weight:600;white-space:nowrap}
.lv-adv{color:var(--adv);background:var(--adv-bg)}.lv-prof{color:var(--prof);background:var(--prof-bg)}
.lv-basic{color:var(--basic);background:var(--basic-bg)}.lv-beg{color:var(--beg);background:var(--beg-bg)}
.lv-abs{color:var(--abs);background:var(--muted-bg)}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--muted-bg);min-width:120px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted-fg);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:10px;align-items:center;font-size:.86rem}
.bar .trk{height:10px;background:var(--muted-bg);border-radius:99px;position:relative;overflow:hidden}
.bar .trk i{position:absolute;inset-block:0;right:0;border-radius:99px}
.bar .trk .mark{position:absolute;inset-block:-2px;width:2px;background:var(--foreground);opacity:.35}
.bars{display:flex;flex-direction:column;gap:9px}
.tcard{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 0;border-bottom:1px solid var(--border)}
.tcard:first-child{padding-top:0}
.tcard:last-of-type{border-bottom:0}
.tcard h3{font-size:.95rem}
.tcard .meta{font-size:.82rem;color:var(--muted-fg)}
.tcard .acts{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.note{border:1px solid var(--border);background:var(--muted-bg);border-radius:10px;padding:10px 14px;font-size:.86rem}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(18px + env(safe-area-inset-left,0px));background:var(--card);color:var(--foreground);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px 16px;border-radius:10px;font-weight:500;z-index:60;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 36px)}
.toast.on{opacity:1;transform:none}
details>summary{cursor:pointer;font-weight:600}
.sel-test{width:100%;max-width:100%}
.sheet>header>.row{min-width:0;max-width:100%}
.sheet>header>.row>select{flex:1 1 240px}

/* home dashboard */
.dash{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px}
.dash .c4{grid-column:span 4}.dash .c3{grid-column:span 3}
.vchart{display:grid;grid-template-columns:auto 1fr;gap:8px;height:300px}
.vchart .y{display:flex;flex-direction:column;justify-content:space-between;font-size:.72rem;color:var(--muted-fg);padding-bottom:22px;text-align:end;font-variant-numeric:tabular-nums}
.vchart .plot{position:relative;display:flex;align-items:end;gap:10px;padding-bottom:22px;border-bottom:0}
.vchart .grid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.vchart .grid i{border-top:1px dashed var(--border)}
.vchart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;position:relative;min-width:0}
.vchart .col i{display:block;width:100%;max-width:46px;background:var(--chart);border-radius:5px 5px 0 0;min-height:2px}
.vchart .col span{position:absolute;bottom:-22px;font-size:.7rem;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vchart .col b{font-size:.7rem;font-weight:600;margin-bottom:3px}
.plist{display:flex;flex-direction:column;gap:16px}
.pitem{display:flex;align-items:center;gap:12px;min-width:0}
.pitem .avatar{border-radius:50%;width:36px;height:36px}
.pitem div{flex:1;min-width:0;line-height:1.35}
.pitem b{display:block;font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--muted-fg);font-size:.78rem}

/* command palette */
.cmd-wrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cmd{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.cmd-in{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted-fg)}
.cmd-in input{flex:1;border:0!important;box-shadow:none!important;height:48px;padding:0;background:transparent;color:var(--foreground);outline:none}
.cmd-list{max-height:360px;overflow-y:auto;padding:6px}
.cmd-h{font-size:.72rem;color:var(--muted-fg);padding:8px 10px 4px;font-weight:500}
.cmd-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:start;font-size:.88rem}
.cmd-it small{margin-inline-start:auto;color:var(--muted-fg);font-size:.75rem}
.cmd-it.on{background:var(--muted-bg)}
.cmd-empty{padding:24px;text-align:center;color:var(--muted-fg)}
#import,#auto{scroll-margin-top:76px}
.help ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}

@media (max-width:1024px){.dash{grid-template-columns:1fr}.dash .c4,.dash .c3{grid-column:auto}}
@media (max-width:768px){
  .sb{position:fixed;inset-block:0;right:0;height:100%;box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .22s ease;margin:0!important}
  .shell.open .sb{transform:none}
  .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .search kbd{display:none}
  .sheet{padding:16px}
  .tcard{grid-template-columns:1fr}
  .page-head h1{font-size:1.3rem}
}

/* entry grid */
.gridwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table.g{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:.88rem}
table.g th,table.g td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0;text-align:center;background:var(--surface)}
table.g thead th{position:sticky;top:0;background:var(--leaf);z-index:2;padding:6px 4px;font-weight:700}
table.g thead tr:nth-child(2) th{top:34px}
table.g .nm{position:sticky;right:0;z-index:1;text-align:right;padding:0 10px;white-space:nowrap;min-width:190px;font-weight:500}
table.g thead .nm{z-index:3}
table.g .num{padding:0 8px;color:var(--muted)}
table.g tfoot td{background:var(--leaf);font-weight:700;padding:5px 4px;position:sticky;bottom:0}
table.g tr.abs td{opacity:.5}
th.s-start,td.s-start{border-right:2px solid var(--line-2)!important}
.c{width:34px;height:32px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:1rem}
.c.v1{color:var(--adv);background:var(--adv-bg)}
.c.v0{color:var(--beg);background:var(--beg-bg)}
.c:focus{outline:2px solid var(--focus);outline-offset:-2px}
.sc{width:64px;border:0;background:transparent;text-align:center;padding:6px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.krow{display:flex;align-items:center;gap:4px}
.krow span{width:34px;color:var(--muted);font-size:.85rem}
.kb{width:29px;height:29px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.85rem;padding:0}
.kb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.c.vn{color:var(--muted);background:var(--leaf)}
table.g thead small{display:block;color:var(--accent);font-size:.75rem;line-height:1}
.scan-card{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.scan-card:last-child{border-bottom:0}
.scan-card canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.scan-card.done{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{min-width:34px;height:28px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.82rem;padding:0 5px;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--adv-bg);color:var(--adv);border-color:transparent}
.chip.bad{background:var(--beg-bg);color:var(--beg);border-color:transparent}
.chip.warn{outline:2px solid var(--basic);outline-offset:-2px}
.progress{height:6px;background:var(--leaf);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.zoom canvas{max-width:100%;max-height:100%;background:#fff}
.kbd{font-family:var(--font-body);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:.8rem}

/* print */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:9mm}
  :root{color-scheme:light}
  body{background:#fff;color:#000}
  #app,.toast{display:none!important}
  #print{display:block;font:11px/1.35 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;color:#000}
}
.pg{page-break-after:always;break-after:page}
.pg:last-child{page-break-after:auto;break-after:auto}
.ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:6px}
.ph .r{text-align:right;font-weight:700;line-height:1.7}
.ph .l{text-align:left;font-weight:700;line-height:1.7}
.ph img{height:62px}
.ptitle{text-align:center;font:700 15px "Readex Pro",Tahoma,sans-serif;margin:4px 0 8px}
table.p{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.p th,table.p td{border:1px solid #000;padding:2px 4px;text-align:center;height:17px}
table.p th{background:#c9e3d3;font-weight:700}
table.p .g{background:#d9d9d9;font-weight:700}
table.p .lg{background:#e4f1ea;font-weight:700}
table.p td.n{text-align:right;padding-right:6px;white-space:nowrap}
.pmain{display:grid;grid-template-columns:1fr 34%;gap:6px;margin-top:6px;align-items:start}
.psig{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000;background:#ececec;margin-top:6px;padding:8px 12px;min-height:70px;font-weight:700;text-align:center}
.psig div{display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.psec{margin-top:10px}
.psec h4{margin:0 0 4px;font:700 12px "Readex Pro",Tahoma,sans-serif;background:#e4f1ea;padding:3px 8px;border-right:4px solid #0e6b57}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function res(t,sid){
  const m=t.marks[sid];
  if(!m) return {entered:false,subj:{}};
  if(m.abs) return {abs:true,entered:false,subj:{}};
  const subj={};let C=0,T=0,any=false;
  for(const s of t.subjects){
    let c=0,tot=0,ent=false;
    if(t.mode==="q"){const a=(m.a&&m.a[s])||[];tot=t.nq[s];for(let i=0;i<tot;i++){if(a[i]===1){c++;ent=true}else if(a[i]===0)ent=true}}
    else{const v=m.s&&m.s[s];tot=+t.max[s]||0;if(v!==""&&v!=null&&!isNaN(v)){c=+v;ent=true}}
    subj[s]={c,tot,ent,pct:ent&&tot?c/tot:null};
    if(ent){C+=c;T+=tot;any=true}
  }
  return {entered:any,subj,c:C,tot:T,pct:any&&T?C/T:null};
}
function stats(t){
  const st=studentsOf(t);
  const rows=st.map(s=>({s,r:res(t,s.id)}));
  const tested=rows.filter(x=>x.r.entered);
  const dist=list=>{const d={adv:0,prof:0,basic:0,beg:0};list.forEach(p=>{const k=lvOf(p);if(k)d[k]++});return d};
  const subj={};
  for(const s of t.subjects){
    const L=tested.filter(x=>x.r.subj[s]&&x.r.subj[s].ent);
    const pcts=L.map(x=>x.r.subj[s].pct);
    const qs=[];
    if(t.mode==="q") for(let i=0;i<t.nq[s];i++){
      let c=0,n=0;const opts=Array(t.nopt||4).fill(0);let blank=0,multi=0,chN=0;
      L.forEach(x=>{const m=t.marks[x.s.id];const v=((m.a||{})[s]||[])[i];n++;if(v===1)c++;
        const ch=((m.ch||{})[s]||[])[i];if(ch!=null){chN++;if(ch>=0)opts[ch]=(opts[ch]||0)+1;else if(ch===-1)multi++;else blank++}});
      const key=((t.key||{})[s]||[])[i];
      let distr=null;if(chN){let best=-1,bc=0;opts.forEach((v,o)=>{if(o!==key&&v>bc){bc=v;best=o}});distr=best>=0?{o:best,c:bc}:null}
      qs.push({i,c,n,pct:n?c/n:null,skill:(t.skills&&t.skills[s]&&t.skills[s][i])||"",opts,blank,multi,chN,key,distr});
    }
    subj[s]={n:L.length,avg:mean(pcts),avgScore:mean(L.map(x=>x.r.subj[s].c)),dist:dist(pcts),qs};
  }
  const pcts=tested.map(x=>x.r.pct);
  const subjAvgs=t.subjects.map(s=>subj[s].avg).filter(v=>v!=null);
  return {rows,tested,abs:rows.filter(x=>x.r.abs).length,total:st.length,
    avg:mean(pcts),avgSubj:mean(subjAvgs),avgScore:mean(tested.map(x=>x.r.c)),sumScore:tested.reduce((a,x)=>a+x.r.c,0),
    maxScore:t.subjects.reduce((a,s)=>a+(t.mode==="q"?t.nq[s]:(+t.max[s]||0)),0),dist:dist(pcts),subj};
}
function stackBar(d){

}

const norm=s=>String(s).replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();
let cmdItems=[],cmdSel=0;
function openCmd(){const w=document.getElementById("cmdWrap");w.hidden=false;const i=document.getElementById("cmdInput");i.value="";buildCmd("");i.focus()}
function closeCmd(){document.getElementById("cmdWrap").hidden=true}
function buildCmd(q){
  const nq=norm(q.trim());const m=x=>!nq||norm(x).includes(nq);
  const pages=NAV.flatMap(([,it])=>it).filter(([,n])=>m(n)).map(([k,n,ic])=>({grp:"الصفحات",ic,label:n,run:()=>go(k)}));
  const tests=[...S.tests].filter(t=>m(t.title+" "+classLabel(t.grade,t.section))).slice(0,8).map(t=>({grp:"الاختبارات",ic:"file",label:`${t.title} — ${classLabel(t.grade,t.section)}`,sub:t.date?hijri(t.date):"",run:()=>{cur={r:0,c:0};go("entry",{id:t.id})}}));
  const studs=nq?S.students.filter(s=>m(s.name)).slice(0,10).map(s=>({grp:"الطلاب",ic:"users",label:s.name,sub:classLabel(s.grade,s.section),run:()=>go("students",{g:s.grade,sec:s.section,hl:s.id})})):[];
  cmdItems=[...pages,...tests,...studs];cmdSel=0;drawCmd();
}
function drawCmd(){
  const L=document.getElementById("cmdList");if(!cmdItems.length){L.innerHTML=`<div class="cmd-empty">لا توجد نتائج.</div>`;return}
  let g="",h="";cmdItems.forEach((it,i)=>{if(it.grp!==g){g=it.grp;h+=`<div class="cmd-h">${g}</div>`}h+=`<button class="cmd-it ${i===cmdSel?"on":""}" data-cmd="${i}">${I(it.ic)}<span>${esc(it.label)}</span>${it.sub?`<small>${esc(it.sub)}</small>`:""}</button>`});
  L.innerHTML=h;const on=L.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});
}
document.getElementById("openCmd").addEventListener("click",openCmd);
document.getElementById("cmdWrap").addEventListener("click",e=>{const b=e.target.closest("[data-cmd]");if(b){closeCmd();cmdItems[+b.dataset.cmd].run();return}if(e.target.id==="cmdWrap")closeCmd()});
document.getElementById("cmdInput").addEventListener("input",e=>buildCmd(e.target.value));
document.getElementById("cmdInput").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);drawCmd()}
  else if(e.key==="ArrowUp"){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);drawCmd()}
  else if(e.key==="Enter"){e.preventDefault();const it=cmdItems[cmdSel];if(it){closeCmd();it.run()}}
  else if(e.key==="Escape")closeCmd();
});
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="ك"||e.code==="KeyK")){e.preventDefault();openCmd()}else if(e.key==="Escape"&&!document.getElementById("cmdWrap").hidden)closeCmd()});

  const r=await worker.recognize(canvas,rect?{rectangle:rect}:{});
  return {lines:r.data.text.split(/\n/).map(s=>s.trim()).filter(Boolean),conf:r.data.confidence,text:r.data.text};
}
async function detectRotation(worker,canvas){
  let best={rot:0,score:-1};
  for(const rot of [0,270,90,180]){
    const c=prepForOCR(canvas,rot,1300);const r=await ocrLines(worker,c);const sc=r.conf*Math.log(1+arWords(r.text));
    if(sc>best.score)best={rot,score:sc};if(r.conf>72&&arWords(r.text)>25)break;
  }

}
async function pdfPagesText(doc){
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],h:Math.abs(it.transform[3])||8}));
    items.sort((a,b)=>b.y-a.y||b.x-a.x);const lines=[];
    items.forEach(it=>{const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*0.4));if(L)L.items.push(it);else lines.push({y:it.y,items:[it]})});
    lines.sort((a,b)=>b.y-a.y);pages.push(lines.map(l=>l.items.sort((a,b)=>b.x-a.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim()));
  }

}
async function extractFromFile(f,status){

  if(ext==="csv"){const txt=await f.text();return parseStudentRows(txt.split(/\r?\n/).map(l=>l.split(/[,;\t]/)))}
  if(ext==="txt"){return parseLines((await f.text()).split(/\r?\n/)).recs}
  if(["xlsx","xls","xlsm","ods"].includes(ext)){
    if(!window.XLSX)throw new Error("xlsx");const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});let recs=[];
    for(const n of wb.SheetNames)recs=recs.concat(parseStudentRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false})));return recs;
  }
  let canvases=[];
  if(ext==="pdf"||/pdf/.test(f.type)){
    const lib=window.pdfjsLib;if(!lib)throw new Error("pdf");
    try{lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
    status("فتح ملف PDF…",0);

    if(pages.flat().join(" ").replace(/[^ء-ي]/g,"").length>200){
      let recs=[],cls=null;pages.forEach(lines=>{const r=parseLines(lines,cls);recs=recs.concat(r.recs);cls=r.cls});return recs;
    }
    for(let p=1;p<=doc.numPages;p++){status(`تجهيز الصفحة ${p} من ${doc.numPages}…`,p/doc.numPages*0.1);const pg=await doc.getPage(p);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:2000/Math.max(vp0.width,vp0.height)});
      const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;canvases.push(c)}
  }else if(/^image\//.test(f.type)||["jpg","jpeg","png","webp","heic","bmp"].includes(ext)){
    const bmp=await createImageBitmap(f);const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;c.getContext("2d").drawImage(bmp,0,0);canvases=[c];
  }else throw new Error("type");

  const w=await getOCR();

  for(let i=0;i<canvases.length;i++){
    status(`قراءة الصفحة ${i+1} من ${canvases.length}…`,0.2+0.8*i/canvases.length);

    const head=await ocrLines(w,c,{left:0,top:0,width:c.width,height:Math.round(c.height*0.3)});
    const hc=parseLines(head.lines).cls;
    const key=hc.grade&&hc.section?hc.grade+"|"+hc.section:null;
    if(key&&seen.has(key))continue;

  }

}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}

function runImport(mode){
  const P=pendingImport;if(!P)return;impGroups(P);let added=0,removed=0;
  P.groups.filter(x=>x.ok&&!P.unsel.has(x.k)).forEach(x=>{
    const names=new Set(x.list.map(r=>norm(r.name)));
    if(mode==="replace"){const drop=S.students.filter(s=>s.grade===x.g&&s.section===x.sec&&!names.has(norm(s.name)));const ids=new Set(drop.map(s=>s.id));
      S.students=S.students.filter(s=>!ids.has(s.id));S.tests.forEach(t=>ids.forEach(id=>delete t.marks[id]));removed+=ids.size}
    const ex=new Set(S.students.filter(s=>s.grade===x.g&&s.section===x.sec).map(s=>norm(s.name)));

  });

function mark(t,sid){if(!t.marks[sid])t.marks[sid]={abs:false,a:{},s:{}};const m=t.marks[sid];m.a=m.a||{};m.s=m.s||{};return m}
function setCell(t,r,c,v){

const OPT=["أ","ب","ج","د","هـ"];
const keyOf=(t,s)=>((t.key||{})[s]||[]);
function keyComplete(t){return t.mode==="q"&&t.subjects.every(s=>{const k=keyOf(t,s);for(let i=0;i<t.nq[s];i++)if(k[i]==null)return false;return true})}
const keyStr=(t,s)=>{const k=keyOf(t,s);return Array.from({length:t.nq[s]},(_,i)=>k[i]==null?"؟":OPT[k[i]]).join(" ")};
function parseKey(str,n,nopt){
  const map={"أ":0,"ا":0,"إ":0,"آ":0,"a":0,"1":0,"١":0,"ب":1,"b":1,"2":1,"٢":1,"ج":2,"c":2,"3":2,"٣":2,"د":3,"d":3,"4":3,"٤":3,"ه":4,"ة":4,"e":4,"5":4,"٥":4,"؟":null,"?":null};
  const out=[];for(const ch of str.toLowerCase().replace(/[ـ\s,،\-]/g,"")){if(ch in map){const v=map[ch];out.push(v!=null&&v<nopt?v:null)}if(out.length>=n)break}
  return out;
}
function siblingsOf(t){return S.tests.filter(x=>x.title===t.title&&x.grade===t.grade&&x.mode==="q"&&x.subjects.join()===t.subjects.join()&&x.subjects.every(s=>x.nq[s]===t.nq[s]))}
function setKeyAll(t,mut){
  const sib=siblingsOf(t);
  sib.forEach(x=>{x.key=x.key||{};x.nopt=t.nopt||4;mut(x);regrade(x)});
  save();
}
function regradeMark(t,m){
  if(!m||!m.ch)return;
  for(const s of t.subjects){const ch=m.ch[s];if(!ch)continue;const k=keyOf(t,s);const a=m.a[s]||(m.a[s]=[]);
    for(let i=0;i<t.nq[s];i++){const c=ch[i];if(c==null)continue;a[i]=k[i]==null?null:(c===k[i]?1:0)}}
}
function regrade(t){Object.values(t.marks).forEach(m=>regradeMark(t,m))}
function setCh(t,r,c,v){
  const st=studentsOf(t),C=cols(t);const s=st[r],cc=C[c];if(!s||!cc)return;
  const m=mark(t,s.id);m.ch=m.ch||{};const ch=m.ch[cc.s]||(m.ch[cc.s]=[]);
  const nv=typeof v==="function"?v(ch[cc.q]):v;ch[cc.q]=nv;
  if(nv==null){const a=m.a[cc.s]||(m.a[cc.s]=[]);a[cc.q]=null}
  regradeMark(t,m);save();
}

/* ---------- answer sheets (OMR layout, all units in mm) ---------- */
const SHEET={W:210,H:297,MK:8,M:[[12,12],[198,12],[198,285],[12,285]],TAB:[25,12],TABS:4,ID_Y:58,ID_S:4.6,ID_GAP:1.6,ID_X0:56.5,Y0:96,RH:9.6,R:3,MAXR:19};
function sheetLayout(t){
  const nopt=t.nopt||4,chunks=[];
  t.subjects.forEach(s=>{for(let f=0;f<t.nq[s];f+=SHEET.MAXR)chunks.push({s,from:f,to:Math.min(t.nq[s],f+SHEET.MAXR)})});
  const k=chunks.length,X0=14,X1=196,W=(X1-X0)/Math.max(k,1);
  const bub=[],labels=[],heads=[];let R=SHEET.R;
  chunks.forEach((c,ci)=>{
    const right=X1-ci*W,numW=8,sp=Math.min(8.6,(W-numW-4)/nopt);R=Math.min(R,sp*0.42);
    const bw=numW+sp*nopt;const off=(W-bw)/2;
    heads.push({x:right-W/2,y:SHEET.Y0-8.5,text:SUBJ_SHORT[c.s]+(c.from?" (تابع)":""),x0:right-W+1.5,x1:right-1.5});
    for(let q=c.from;q<c.to;q++){const y=SHEET.Y0+(q-c.from)*SHEET.RH;
      labels.push({x:right-off-numW/2,y,text:q+1});
      for(let o=0;o<nopt;o++)bub.push({s:c.s,q,o,x:right-off-numW-sp/2-o*sp,y});}
  });
  return {bub,labels,heads,ok:k<=5,chunks:k,R};
}
const idCenters=()=>Array.from({length:16},(_,i)=>[SHEET.ID_X0+SHEET.ID_S/2+i*(SHEET.ID_S+SHEET.ID_GAP),SHEET.ID_Y]);
function encodeId(no){const b=[];for(let i=0;i<12;i++)b.push((no>>i)&1);let cs=0;b.forEach((v,i)=>cs+=v*(i+1));cs=(cs%16)^5;for(let j=0;j<4;j++)b.push((cs>>j)&1);return b}
function decodeId(bits){let no=0,cs=0;for(let i=0;i<12;i++){no|=bits[i]<<i;cs+=bits[i]*(i+1)}cs=(cs%16)^5;let got=0;for(let j=0;j<4;j++)got|=bits[12+j]<<j;return got===cs?no:null}
function sheetPage(t,stu){
  const L=sheetLayout(t),set=S.settings,mm=v=>v.toFixed(2)+"mm";
  const sq=(x,y,s,fill)=>`<i style="position:absolute;left:${mm(x-s/2)};top:${mm(y-s/2)};width:${mm(s)};height:${mm(s)};${fill?"background:#000":"border:.25mm solid #999;box-sizing:border-box"}"></i>`;
  let h=`<div class="as">`;
  SHEET.M.forEach(([x,y])=>h+=sq(x,y,SHEET.MK,true));
  h+=sq(SHEET.TAB[0],SHEET.TAB[1],SHEET.TABS,true);
  h+=`<div class="as-t" style="top:20mm">${esc(set.school)} · ${esc(set.year)}هـ</div>
      <div class="as-t" style="top:26mm;font-size:15pt;font-weight:700">ورقة إجابة — ${esc(t.title)}</div>
      <div class="as-t" style="top:34mm">${classLabel(t.grade,t.section)}</div>
      <div class="as-name" style="top:40mm">${stu?`اسم الطالب: <b>${esc(stu.name)}</b>`:"اسم الطالب: ...................................................."}</div>`;
  const bits=encodeId(stu?stu.no:0);

async function runScan(files){

/* ---------- confirm actions ---------- */
function doConfirm(key){
  const [k,v]=key.split(/:(.*)/s);
  if(k==="deltest"){S.tests=S.tests.filter(t=>t.id!==v);toast("حُذف الاختبار");if(view==="entry")view="tests"}
  if(k==="delstu"){S.students=S.students.filter(s=>s.id!==v);S.tests.forEach(t=>delete t.marks[v]);toast("حُذف الطالب")}
  if(k==="delsec"){const [g,sec]=v.split("|");const ids=new Set(S.students.filter(s=>s.grade===g&&s.section===sec).map(s=>s.id));S.students=S.students.filter(s=>!ids.has(s.id));toast(`حُذف ${ids.size} طالبًا`)}
  if(k==="wipe"){S=defState();toast("مُسحت كل البيانات")}
  if(k==="restore"){S=migrate(pendingRestore);pendingRestore=null;toast("استُعيدت النسخة الاحتياطية")}
  save(true);render();
}

document.addEventListener("keydown",e=>{
  const b=e.target;if(view!=="entry")return;
  if(b.classList&&b.classList.contains("c")){
    const t=testById(ctx.id);cur={r:+b.dataset.r,c:+b.dataset.c};const k=e.key;
    if(t.useCh){
      const map={"أ":0,"ا":0,"إ":0,"a":0,"1":0,"١":0,"ب":1,"b":1,"2":1,"٢":1,"ج":2,"c":2,"3":2,"٣":2,"د":3,"d":3,"4":3,"٤":3,"ه":4,"e":4,"5":4,"٥":4,"0":-2,"٠":-2,"-":-2};
      const kk=k.toLowerCase();
      if(kk in map&&(map[kk]<(t.nopt||4))){e.preventDefault();setCh(t,cur.r,cur.c,map[kk]);moveNext(t);return}
      if(k===" "){e.preventDefault();setCh(t,cur.r,cur.c,cycleCh(t.nopt||4));refreshGrid();return}
      if(k==="Backspace"||k==="Delete"){e.preventDefault();setCh(t,cur.r,cur.c,null);refreshGrid();return}
    }
    let v;if(t.useCh){}else if(["1","١","+","ص"].includes(k))v=1;else if(["0","٠","-","خ"].includes(k))v=0;
    if(v!==undefined){e.preventDefault();setCell(t,cur.r,cur.c,v);moveNext(t);return}
    if(k===" "){e.preventDefault();setCell(t,cur.r,cur.c,x=>x==null?1:x===1?0:null);refreshGrid();return}
    if(k==="Backspace"||k==="Delete"){e.preventDefault();setCell(t,cur.r,cur.c,null);refreshGrid();return}
    if(k==="ArrowLeft"){e.preventDefault();moveCur(0,1);return}
    if(k==="ArrowRight"){e.preventDefault();moveCur(0,-1);return}
    if(k==="ArrowDown"||k==="Enter"){e.preventDefault();moveCur(1,0);return}
    if(k==="ArrowUp"){e.preventDefault();moveCur(-1,0);return}
  }
  if(b.classList&&b.classList.contains("sc")&&e.key==="Enter"){e.preventDefault();const r=+b.dataset.r+1,c=+b.dataset.c;const n=document.querySelector(`#grid [data-r="${r}"][data-c="${c}"]`);if(n)n.focus()}
});

}

  if(d.impg){if(pendingImport){if(el.checked)pendingImport.unsel.delete(d.impg);else pendingImport.unsel.add(d.impg);refreshImp()}return}
  if(d.impgrade){regroupImp(d.impgrade,"grade",el.value);return}

  if(d.impnames){const P=pendingImport;if(!P)return;const k=d.impnames;const [g,sec]=k.split("|");const tmpl={grade:g==="?"?null:g,section:sec==="?"?null:sec};
    P.recs=P.recs.filter(r=>((r.grade||"?")+"|"+(r.section||"?"))!==k).concat(el.value.split(/\r?\n/).map(x=>fixName(cleanName(x))).filter(x=>x.length>=4).map(n=>({name:n,...tmpl})));refreshImp();return}
  if(d.skill){const [k,i]=d.skill.split("|");const t=testById(ctx.id);(t.skills[k]=t.skills[k]||[])[+i]=el.value.trim();save();refreshGrid();return}
  if(d.tedit){const t=testById(ctx.id);if(d.tedit==="title")t.title=el.value.trim()||t.title;else if(d.tedit==="date")t.date=el.value;else{const k=d.tedit.split("|")[1];const n=Math.max(1,Math.min(60,parseInt(el.value)||1));if(t.mode==="q"){t.nq[k]=n;Object.values(t.marks).forEach(m=>{if(m.a&&m.a[k])m.a[k]=m.a[k].slice(0,n)})}else t.max[k]=n}save();render();toast("حُفظ التعديل");return}
  if(d.set){let v=el.value;if(d.set==="defaultQ")v=Math.max(1,Math.min(60,parseInt(v)||5));S.settings[d.set]=v;save();document.getElementById("schoolLine").textContent=S.settings.school;toast("حُفظ");return}
  if(d.level){const L=S.settings.levels;L[d.level]=Math.max(1,Math.min(100,+el.value||L[d.level]));if(!(L.adv>L.prof&&L.prof>L.basic))toast("تنبيه: يجب أن يكون متقدم > متمكن > مُلِمّ");save();render();return}
  if(d.gsub){const [g,k]=d.gsub.split("|");const a=S.settings.subjects[g];S.settings.subjects[g]=el.checked?SUBJ_ORDER.filter(x=>a.includes(x)||x===k):a.filter(x=>x!==k);save();return}
});

<script>
/* ===== نَسَق: ترخيص راصد نافس (تجربة لفصل واحد، والترخيص لعام دراسي) ===== */
(function(){
  const CFG={url:"https://rddibqurdjmrvmlneqss.supabase.co",anonKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkZGlicXVyZGptcnZtbG5lcXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzMwMjgsImV4cCI6MjEwNzc0OTAyOH0.AEyFYtwsFHGM3CyhSV13pSN420Hno5QMwxx6veetxXo"};
  const EMBED=/[?&]embed=1/.test(location.search);
  const NQ=window.NQ={full:false,state:"checking",until:null,email:null};
  const today=()=>new Date().toISOString().slice(0,10);

  const fmt=d=>{try{return new Date(d+"T12:00:00Z").toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};

  /* الواجهة: شريط صغير أسفل الصفحة ونافذة */
  const css=document.createElement("style");
  css.textContent=`.nq-bar{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:14px;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 6px 24px rgba(2,6,24,.12);font:500 13px var(--font-body)}
  .nq-bar b{font-weight:600}.nq-bar .nq-dot{width:8px;height:8px;border-radius:50%;background:#c1b489;flex:none}.nq-bar.ok .nq-dot{background:#07a869}

  .nq-bar a.pri{background:#15445a;border-color:#15445a;color:#fff}.nq-bar .x{border:0;padding:4px 8px;color:var(--muted-fg)}
  .nq-m{position:fixed;inset:0;z-index:70;background:rgba(2,6,24,.45);display:none;align-items:center;justify-content:center;padding:16px}.nq-m.open{display:flex}
  .nq-d{background:var(--card);color:var(--foreground);border-radius:14px;max-width:420px;width:100%;padding:22px;border:1px solid var(--border);font-family:var(--font-body);text-align:start}
  .nq-d h3{margin:0 0 8px;font-size:17px}.nq-d p{margin:0 0 16px;color:var(--muted-fg);line-height:1.8;font-size:14px}.nq-d .r{display:flex;gap:8px;flex-wrap:wrap}
  .nq-d a,.nq-d button{font:600 13.5px var(--font-body);border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:transparent;color:inherit;text-decoration:none;cursor:pointer}.nq-d a.pri{background:#15445a;border-color:#15445a;color:#fff}
  .nq-wm{display:none}
  @media print{.nq-bar,.nq-m{display:none!important}.nq-wm{display:block;position:fixed;inset:0;pointer-events:none;z-index:9999}.nq-wm span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-32deg);font:700 54pt "IBM Plex Sans Arabic",Arial,sans-serif;color:rgba(21,68,90,.09);white-space:nowrap}.nq-wm i{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font:600 9pt "IBM Plex Sans Arabic",Arial,sans-serif;font-style:normal;color:#5f7280}}
  html.nq-embed body{pointer-events:none}html.nq-embed .nq-bar{display:none}`;
  document.head.appendChild(css);
  if(EMBED)document.documentElement.classList.add("nq-embed");
  const bar=document.createElement("div");bar.className="nq-bar";bar.setAttribute("role","status");
  const modal=document.createElement("div");modal.className="nq-m";modal.innerHTML=`<div class="nq-d" role="dialog" aria-modal="true" aria-labelledby="nqT"><h3 id="nqT"></h3><p id="nqP"></p><div class="r" id="nqR"></div></div>`;
  document.body.append(bar,modal);
  modal.addEventListener("click",e=>{if(e.target===modal||e.target.closest("[data-nqx]"))modal.classList.remove("open")});
  const BUY="./#/p/nafes",LOGIN="./#/login?back=nafes";
  function ask(t,p,showLogin){modal.querySelector("#nqT").textContent=t;modal.querySelector("#nqP").textContent=p;

  let barHidden=false;

    if(!saved||!saved.students||keysOf(saved).length<=1){const k=(saved&&keysOf(saved)[0])||keysOf(S)[0];const drop=new Set(S.students.filter(x=>x.grade+"|"+x.section!==k).map(x=>x.id));

  /* علامة «نسخة تجربة» على التقارير المطبوعة (أوراق الإجابة تُطبع بدونها لأنها تُقرأ آليًا) */

  /* ملفات Excel في التجربة: ورقة تنبيه وترويسة */
